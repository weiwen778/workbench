name: workbench-element
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${WB_DB_NAME:-workbench}
      POSTGRES_USER: ${WB_DB_USER:-workbench}
      POSTGRES_PASSWORD: ${WB_DB_PASSWORD:?请在 .env 中设置 WB_DB_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - wb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WB_DB_USER:-workbench} -d ${WB_DB_NAME:-workbench}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 384m
    ports:
      # 仅绑定本机回环地址，不直接对公网开放
      - "127.0.0.1:${WB_DB_PORT:-5433}:5432"

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WB_ENV: production
      WB_DATABASE_URL: postgresql+psycopg://${WB_DB_USER:-workbench}:${WB_DB_PASSWORD}@db:5432/${WB_DB_NAME:-workbench}
      WB_STORAGE_DIR: /data/storage
      WB_BACKUP_DIR: /data/backups
      WB_HOST_METRICS_FILE: /metrics/current.json
      WB_BACKUP_ENABLED: ${WB_BACKUP_ENABLED:-true}
      WB_ADMIN_USERNAME: ${WB_ADMIN_USERNAME:-admin}
      WB_ADMIN_PASSWORD: ${WB_ADMIN_PASSWORD:?请在 .env 中设置 WB_ADMIN_PASSWORD}
      WB_ENCRYPTION_KEY: ${WB_ENCRYPTION_KEY:?请在 .env 中设置 WB_ENCRYPTION_KEY}
      WB_PUBLIC_BASE_URL: ${WB_PUBLIC_BASE_URL:-http://127.0.0.1:18743}
      WB_COOKIE_SECURE: ${WB_COOKIE_SECURE:-false}
      WB_DB_POOL_SIZE: ${WB_DB_POOL_SIZE:-5}
      WB_DB_MAX_OVERFLOW: ${WB_DB_MAX_OVERFLOW:-10}
      WB_DB_POOL_TIMEOUT: ${WB_DB_POOL_TIMEOUT:-5}
      WB_REQUEST_QUEUE_TIMEOUT: ${WB_REQUEST_QUEUE_TIMEOUT:-10}
      WB_MAX_UPLOAD_BYTES: ${WB_MAX_UPLOAD_BYTES:-20000000}
      WB_LOGIN_ATTEMPT_RETENTION_DAYS: ${WB_LOGIN_ATTEMPT_RETENTION_DAYS:-7}
      WB_WHITEBOARD_ASSET_GRACE_HOURS: ${WB_WHITEBOARD_ASSET_GRACE_HOURS:-24}
      WB_FEED_ENABLED: ${WB_FEED_ENABLED:-true}
      WB_FEED_DAILYHOT_BASE_URL: ${WB_FEED_DAILYHOT_BASE_URL:-https://api-hot.imsyy.top}
      WB_FEED_GOOGLE_TRENDS_URL: ${WB_FEED_GOOGLE_TRENDS_URL:-https://trends.google.com/trending/rss?geo=US}
      WB_FEED_HOT_INTERVAL_SECONDS: ${WB_FEED_HOT_INTERVAL_SECONDS:-900}
      WB_FEED_RSS_INTERVAL_SECONDS: ${WB_FEED_RSS_INTERVAL_SECONDS:-1800}
      WB_FEED_SCHEDULER_INTERVAL_SECONDS: ${WB_FEED_SCHEDULER_INTERVAL_SECONDS:-60}
      WB_FEED_TIMEOUT_SECONDS: ${WB_FEED_TIMEOUT_SECONDS:-12}
      WB_FEED_MAX_BYTES: ${WB_FEED_MAX_BYTES:-2000000}
      WB_FEED_MAX_REDIRECTS: ${WB_FEED_MAX_REDIRECTS:-5}
      WB_FEED_RETRY_MAX_SECONDS: ${WB_FEED_RETRY_MAX_SECONDS:-3600}
      WB_FEED_RUNSIGNUP_INTERVAL_SECONDS: ${WB_FEED_RUNSIGNUP_INTERVAL_SECONDS:-21600}
      WB_FEED_RUNSIGNUP_COOLDOWN_SECONDS: ${WB_FEED_RUNSIGNUP_COOLDOWN_SECONDS:-600}
      WB_FEED_RUNSIGNUP_WINDOW_DAYS: ${WB_FEED_RUNSIGNUP_WINDOW_DAYS:-90}
      WB_MEDIA_ENABLED: ${WB_MEDIA_ENABLED:-true}
      WB_MEDIA_PLATFORMS: ${WB_MEDIA_PLATFORMS:-douyin,xhs,kuaishou}
      WB_MEDIA_TIMEOUT_SECONDS: ${WB_MEDIA_TIMEOUT_SECONDS:-60}
      WB_MEDIA_MAX_CONCURRENCY: ${WB_MEDIA_MAX_CONCURRENCY:-2}
      WB_MEDIA_MAX_DOWNLOAD_BYTES: ${WB_MEDIA_MAX_DOWNLOAD_BYTES:-300000000}
      WB_MEDIA_DOWNLOAD_TTL_SECONDS: ${WB_MEDIA_DOWNLOAD_TTL_SECONDS:-7200}
      WB_MEDIA_DOUYIN_COOKIE: ${WB_MEDIA_DOUYIN_COOKIE:-}
      WB_MEDIA_XHS_COOKIE: ${WB_MEDIA_XHS_COOKIE:-}
      WB_MEDIA_KUAISHOU_COOKIE: ${WB_MEDIA_KUAISHOU_COOKIE:-}
      TZ: Asia/Shanghai
    volumes:
      - wb_storage:/data/storage
      - wb_backups:/data/backups
      - wb_metrics:/metrics:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 640m
    ports:
      - "127.0.0.1:${WB_API_PORT:-8000}:8000"

  host-metrics:
    build: ./server
    restart: unless-stopped
    command: ["python", "-m", "app.services.server_metrics", "--output-dir", "/metrics", "--host-root", "/host"]
    network_mode: host
    pid: host
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    cpus: 0.1
    volumes:
      - /:/host:ro,rslave
      - wb_metrics:/metrics
    environment:
      TZ: Asia/Shanghai

  web:
    build:
      context: .
      dockerfile: web-react/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${WB_BIND_ADDRESS:-0.0.0.0}:${WB_HTTP_PORT:-18743}:80"
    mem_limit: 128m

volumes:
  wb_pgdata:
  wb_storage:
  wb_backups:
  wb_metrics:
